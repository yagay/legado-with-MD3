name: Patch AnalyzeUrl upstream router

on:
  push:
    branches: [beta]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: beta
          fetch-depth: 0
      - name: Patch AnalyzeUrl MODERN eval path
        run: |
          python3 -c "from pathlib import Path; import base64; p=Path('app/src/main/java/io/legado/app/model/analyzeRule/AnalyzeUrl.kt'); s=p.read_text(); anchor=base64.b64decode('aW1wb3J0IGlvLmxlZ2Fkby5hcHAuaGVscC5zb3VyY2UuZ2V0U2hhcmVTY29wZQo=').decode(); imports=base64.b64decode('aW1wb3J0IGlvLmxlZ2Fkby5hcHAubW9kZWwuanNFbmdpbmUuU291cmNlSnNFbmdpbmVNb2RlCmltcG9ydCBpby5sZWdhZG8uYXBwLm1vZGVsLmpzRW5naW5lLlNvdXJjZUpzRW5naW5lTW9kZVN0b3JlCmltcG9ydCBpby5sZWdhZG8uYXBwLm1vZGVsLmpzRW5naW5lLlNvdXJjZUpzRW5naW5lUm91dGVyCg==').decode(); s=s if imports in s else s.replace(anchor,anchor+imports,1); old=base64.b64decode('').decode(); new=base64.b64decode('').decode(); assert old in s or new in s, 'AnalyzeUrl evalJS block not found'; p.write_text(s if new in s else s.replace(old,new,1))"
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/io/legado/app/model/analyzeRule/AnalyzeUrl.kt
          git commit -m "fix: route AnalyzeUrl JavaScript through upstream engine"
          git push origin HEAD:beta
