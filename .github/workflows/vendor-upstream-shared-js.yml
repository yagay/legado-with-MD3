name: Vendor upstream shared JS scope

on:
  push:
    branches: [ beta ]

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Vendor TeamLegado SharedJsScope and CryptoJS assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/legado-upstream
          git clone --depth=1 --filter=blob:none --sparse https://github.com/LegadoTeam/legado.git /tmp/legado-upstream
          git -C /tmp/legado-upstream sparse-checkout set \
            app/src/main/java/io/legado/app/model/SharedJsScope.kt \
            app/src/main/assets/scripts

          mkdir -p app/src/main/assets/scripts
          cp /tmp/legado-upstream/app/src/main/assets/scripts/cryptojs.min.js app/src/main/assets/scripts/
          cp /tmp/legado-upstream/app/src/main/assets/scripts/cryptojs.LICENSE.txt app/src/main/assets/scripts/

          python3 - <<'PY'
          from pathlib import Path
          src = Path('/tmp/legado-upstream/app/src/main/java/io/legado/app/model/SharedJsScope.kt').read_text(encoding='utf-8')
          src = src.replace('package io.legado.app.model\n', 'package io.legado.app.model.jsEngine\n')
          src = src.replace('import com.script.', 'import com.script.upstream.')
          src = src.replace('object SharedJsScope {', 'object UpstreamSharedJsScope {')
          src = src.replace('File(appCtx.cacheDir, "shareJs")', 'File(appCtx.cacheDir, "shareJsUpstream")')
          # Debug moved out of the package when this copy is isolated under jsEngine.
          anchor = 'import io.legado.app.help.http.okHttpClient\n'
          if anchor not in src:
              raise SystemExit('SharedJsScope import anchor not found')
          src = src.replace(anchor, anchor + 'import io.legado.app.model.Debug\n', 1)
          out = Path('app/src/main/java/io/legado/app/model/jsEngine/UpstreamSharedJsScope.kt')
          out.write_text(src, encoding='utf-8')
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/io/legado/app/model/jsEngine/UpstreamSharedJsScope.kt \
                  app/src/main/assets/scripts/cryptojs.min.js \
                  app/src/main/assets/scripts/cryptojs.LICENSE.txt
          git diff --cached --quiet && exit 0
          git commit -m "refactor: add upstream SharedJsScope compatibility layer"
          git push
