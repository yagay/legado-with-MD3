name: Temporary review capability filter fix
on:
  push:
    branches: [ beta ]
    paths:
      - '.github/workflows/temp-review-capability-filter.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
      - name: Apply patch
        run: python .github/scripts/patch_review_capability_filters.py
      - name: Clean temporary files
        run: rm -f .github/workflows/temp-review-capability-filter.yml .github/scripts/patch_review_capability_filters.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(source): populate review capability filters from full sources"
          git push origin beta