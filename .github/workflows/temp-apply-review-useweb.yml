name: Temporary review/useweb migration

on:
  push:
    branches: [ beta ]
    paths:
      - '.github/scripts/apply-review-useweb.py'
      - '.github/workflows/temp-apply-review-useweb.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply migration
        run: python .github/scripts/apply-review-useweb.py
      - name: Remove temporary migration files
        run: |
          rm .github/scripts/apply-review-useweb.py
          rm .github/workflows/temp-apply-review-useweb.yml
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(beta): add review filters and useweb rendering"
          git push origin beta
