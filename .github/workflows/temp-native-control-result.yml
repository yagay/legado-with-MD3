name: Temporary native control result migration

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/temp-native-control-result.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Apply migration
        run: python3 .github/scripts/apply-native-control-result.py
      - name: Remove temporary files
        run: |
          rm .github/scripts/apply-native-control-result.py
          rm .github/workflows/temp-native-control-result.yml
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor(explore): consume unified native controls result"
          git push origin beta
