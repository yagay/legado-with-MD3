name: Temporary restore source popup
on:
  push:
    branches: [ beta ]
    paths: [ '.github/workflows/temp-restore-source-popup.yml' ]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 3
      - name: Restore and fix popup offset
        shell: bash
        run: |
          FILE='app/src/main/java/io/legado/app/ui/main/explore/ExploreScreen.kt'
          git show 072f45a02f160b2decc046c189977f628ce3a123:"$FILE" > "$FILE"
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/io/legado/app/ui/main/explore/ExploreScreen.kt')
          s=p.read_text()
          old='val menuPrefixCount = if (composeEngine) 3 else 2'
          new='val menuPrefixCount = if (composeEngine) 2 else 1'
          if old not in s:
              raise SystemExit('popup prefix target not found')
          p.write_text(s.replace(old,new,1))
          PY
          rm -f .github/workflows/temp-restore-source-popup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(explore): keep default source below popup search'
          git push origin beta