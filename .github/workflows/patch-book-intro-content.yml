name: Patch book intro content

on:
  push:
    branches: [beta]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Wire rich intro renderer
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/src/main/java/io/legado/app/ui/book/info/BookInfoScreen.kt')
          text = path.read_text()
          old = '''        AnimatedTextLine(\n            text = book.displayIntro.orEmpty().ifBlank { stringResource(R.string.intro_show_null) },\n            style = LegadoTheme.typography.bodyMedium,\n        )\n'''
          new = '''        BookIntroContent(\n            text = book.displayIntro.orEmpty().ifBlank { stringResource(R.string.intro_show_null) },\n            baseUrl = book.bookUrl,\n        )\n'''
          if new in text:
              raise SystemExit(0)
          if old not in text:
              raise SystemExit('BookInfo intro call site not found')
          path.write_text(text.replace(old, new, 1))
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/io/legado/app/ui/book/info/BookInfoScreen.kt
          git commit -m "fix: render rich book intro protocols"
          git push origin HEAD:beta
