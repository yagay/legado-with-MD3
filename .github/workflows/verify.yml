name: Verify

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**/modules/web/**'
  pull_request:
    paths-ignore:
      - '**/modules/web/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # settings.gradle 里的 aliyun 镜像面向国内开发机，GitHub runner 上可能不稳定。
      - name: Remove Aliyun mirrors (unreliable in CI)
        run: |
          sed -i '/maven.aliyun.com/d' settings.gradle

      # 普通 push / PR 只做架构检查和 Debug 编译，缩短日常反馈时间。
      - name: Run architecture check and debug build
        run: |
          chmod +x gradlew
          ./gradlew \
            verifyConfigArchitecture \
            assembleAppDebug \
            --no-daemon \
            --no-configuration-cache

      # 手动触发 Verify 时再执行耗时较高的单元测试和 Lint。
      - name: Run full tests and lint
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          ./gradlew \
            testAppDebugUnitTest \
            lintAppDebug \
            --continue \
            --no-daemon \
            --no-configuration-cache

      - name: Upload unit test reports
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-unit-test-reports
          if-no-files-found: warn
          path: |
            app/build/test-results/testAppDebugUnitTest/**
            app/build/reports/tests/testAppDebugUnitTest/**

      - name: Upload lint reports
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-lint-reports
          if-no-files-found: warn
          path: |
            app/build/reports/lint-results-appDebug.html
            app/build/reports/lint-results-appDebug.xml
            app/build/reports/lint-results-appDebug.txt
            app/build/reports/lint-results-appDebug.sarif
