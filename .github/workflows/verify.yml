name: Verify

on:
  push:
    branches:
      - main
      - master
      - beta5
    paths-ignore:
      - '**/modules/web/**'
      - '.github/beta5-build-result.txt'
  pull_request:
    paths-ignore:
      - '**/modules/web/**'
      - '.github/beta5-build-result.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Remove Aliyun mirrors (unreliable in CI)
        run: |
          sed -i '/maven.aliyun.com/d' settings.gradle

      - name: Assemble debug APK
        id: assemble
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew assembleAppDebug --no-daemon --no-configuration-cache 2>&1 | tee assemble.log

      - name: Persist beta5 build diagnostics
        if: ${{ always() && github.ref == 'refs/heads/beta5' }}
        env:
          ASSEMBLE_OUTCOME: ${{ steps.assemble.outcome }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p .github
          {
            echo "source_sha=$SOURCE_SHA"
            echo "outcome=$ASSEMBLE_OUTCOME"
            echo "---- compiler diagnostics ----"
            if [ "$ASSEMBLE_OUTCOME" = "success" ]; then
              echo "ASSEMBLE SUCCESS"
            else
              grep -E '(^e: |error:|Unresolved reference|Cannot find a parameter|No value passed|None of the following|Type mismatch|Overload resolution ambiguity|Cannot infer|FAILURE:|Compilation error)' assemble.log | head -n 120 || true
              echo "---- tail ----"
              tail -n 100 assemble.log || true
            fi
          } > .github/beta5-build-result.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/beta5-build-result.txt
          if ! git diff --cached --quiet; then
            git commit -m "ci(beta5): update build diagnostics [skip ci]"
            git push
          fi

      - name: Fail when debug build failed
        if: ${{ steps.assemble.outcome != 'success' }}
        run: exit 1
