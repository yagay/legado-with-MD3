name: Verify

on:
  push:
    branches:
      - main
      - master
      - beta5
    paths-ignore:
      - '**/modules/web/**'
  pull_request:
    paths-ignore:
      - '**/modules/web/**'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Remove Aliyun mirrors (unreliable in CI)
        run: |
          sed -i '/maven.aliyun.com/d' settings.gradle
          chmod +x gradlew

      - name: Architecture check
        id: architecture
        continue-on-error: true
        run: |
          ./gradlew verifyConfigArchitecture --no-daemon --no-configuration-cache 2>&1 | tee architecture.log

      - name: Assemble debug APK
        id: assemble
        continue-on-error: true
        run: |
          ./gradlew assembleAppDebug --no-daemon --no-configuration-cache 2>&1 | tee assemble.log

      - name: Unit tests
        id: tests
        continue-on-error: true
        run: |
          ./gradlew testAppDebugUnitTest --no-daemon --no-configuration-cache 2>&1 | tee tests.log

      - name: Lint
        id: lint
        continue-on-error: true
        run: |
          ./gradlew lintAppDebug --no-daemon --no-configuration-cache 2>&1 | tee lint.log

      - name: Upload unit test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-unit-test-reports
          if-no-files-found: warn
          path: |
            app/build/test-results/testAppDebugUnitTest/**
            app/build/reports/tests/testAppDebugUnitTest/**

      - name: Upload lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-lint-reports
          if-no-files-found: warn
          path: |
            app/build/reports/lint-results-appDebug.html
            app/build/reports/lint-results-appDebug.xml
            app/build/reports/lint-results-appDebug.txt
            app/build/reports/lint-results-appDebug.sarif

      - name: Report diagnostic statuses
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          ARCHITECTURE: ${{ steps.architecture.outcome }}
          ASSEMBLE: ${{ steps.assemble.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          LINT: ${{ steps.lint.outcome }}
        run: |
          report() {
            name="$1"
            outcome="$2"
            log="$3"
            if [ "$outcome" = "success" ]; then
              state=success
              description="$name passed"
            else
              state=failure
              description=$(grep -m1 -E '(^e: |^FAILURE:| error: |Exception|Unresolved reference|Compilation error)' "$log" 2>/dev/null | sed 's/[[:space:]]\+/ /g' | cut -c1-120)
              [ -n "$description" ] || description="$name failed; see Actions log"
            fi
            payload=$(python - "$state" "$description" "$name" <<'PY'
import json, sys
print(json.dumps({"state": sys.argv[1], "description": sys.argv[2], "context": "beta5/" + sys.argv[3]}))
PY
)
            curl --fail-with-body -sS -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/statuses/$COMMIT_SHA" \
              -d "$payload"
          }
          report architecture "$ARCHITECTURE" architecture.log
          report assemble "$ASSEMBLE" assemble.log
          report tests "$TESTS" tests.log
          report lint "$LINT" lint.log

      - name: Fail verification when a task failed
        if: ${{ always() }}
        env:
          ARCHITECTURE: ${{ steps.architecture.outcome }}
          ASSEMBLE: ${{ steps.assemble.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          LINT: ${{ steps.lint.outcome }}
        run: |
          test "$ARCHITECTURE" = success
          test "$ASSEMBLE" = success
          test "$TESTS" = success
          test "$LINT" = success
