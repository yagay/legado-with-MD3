name: Beta2 Performance Optimization (one-shot)

on:
  push:
    branches:
      - beta2
    paths:
      - '.github/workflows/beta2-performance-once.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta2
        uses: actions/checkout@v5
        with:
          ref: beta2
          fetch-depth: 0

      - name: Apply targeted performance patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if count is not None and found != count:
                  raise SystemExit(f"{path}: expected {count} occurrences, found {found}: {old[:100]!r}")
              if found == 0:
                  raise SystemExit(f"{path}: pattern not found: {old[:100]!r}")
              p.write_text(text.replace(old, new))
              print(f"patched {path}: {found} occurrence(s)")

          main = 'app/src/main/java/io/legado/app/ui/main/MainScreen.kt'
          replace_exact(
              main,
              'import kotlinx.coroutines.withContext\n',
              'import kotlinx.coroutines.withContext\nimport kotlin.math.abs\n',
              1,
          )
          replace_exact(
              main,
              '''        coroutineScope.launch {\n            pagerState.animateScrollToPage(index)\n        }''',
              '''        coroutineScope.launch {\n            // Avoid animating through every intermediate top-level page.\n            // Distant tab jumps used to compose/measure several heavy pages in one gesture.\n            if (abs(pagerState.currentPage - index) > 1) {\n                pagerState.scrollToPage(index)\n            } else {\n                pagerState.animateScrollToPage(index)\n            }\n        }''',
              1,
          )
          replace_exact(
              main,
              '''    val useLiquidGlass = useFloatingBottomBar &&\n            mainUiState.useFloatingBottomBarLiquidGlass &&\n            Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU\n''',
              '''    val useLiquidGlass = useFloatingBottomBar &&\n            mainUiState.useFloatingBottomBarLiquidGlass &&\n            Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU\n    // Blur/backdrop capture is one of the most expensive operations while the root pager moves.\n    // Keep the visual effect at rest, but suspend it for the duration of a page transition.\n    val enableLiquidGlassRendering = useLiquidGlass && !pagerState.isScrollInProgress\n''',
              1,
          )
          replace_exact(main, 'if (useLiquidGlass) {', 'if (enableLiquidGlassRendering) {', 1)
          replace_exact(main, 'isBlurEnabled = useLiquidGlass,', 'isBlurEnabled = enableLiquidGlassRendering,', 1)
          replace_exact(main, 'beyondViewportPageCount = 4', 'beyondViewportPageCount = 1', 1)
          replace_exact(
              main,
              '            else -> Lifecycle.State.STARTED\n',
              '            else -> Lifecycle.State.CREATED\n',
              1,
          )

          bookshelf_vm = 'app/src/main/java/io/legado/app/ui/main/bookshelf/BookshelfViewModel.kt'
          replace_exact(
              bookshelf_vm,
              '''    private val groupPreviewsStateFlow = MutableStateFlow(\n        GroupPreviewState(persistentMapOf(), persistentMapOf(), 0)\n    )''',
              '''    private val groupPreviewsStateFlow: StateFlow<GroupPreviewState> = groupPreviewsFlow\n        .stateIn(\n            viewModelScope,\n            SharingStarted.WhileSubscribed(5000),\n            GroupPreviewState(persistentMapOf(), persistentMapOf(), 0)\n        )''',
              1,
          )
          replace_exact(
              bookshelf_vm,
              '''        viewModelScope.launch {\n            groupPreviewsFlow.collect { groupPreviewsStateFlow.value = it }\n        }\n''',
              '',
              1,
          )

          explore = 'app/src/main/java/io/legado/app/ui/book/explore/ExploreShowScreen.kt'
          replace_exact(
              explore,
              '                                modifier = Modifier.animateItem(),\n',
              '                                modifier = Modifier,\n',
              2,
          )

          # Remove this one-shot workflow in the resulting commit so later beta2 pushes are unaffected.
          Path('.github/workflows/beta2-performance-once.yml').unlink()
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Remove Aliyun mirrors for CI
        run: sed -i '/maven.aliyun.com/d' settings.gradle

      - name: Compile optimized beta2
        timeout-minutes: 45
        run: |
          chmod +x gradlew
          ./gradlew assembleAppDebug \
            -PenableAbiSplits=false \
            --no-daemon \
            --no-configuration-cache

      - name: Run focused compatibility tests
        timeout-minutes: 30
        run: |
          ./gradlew \
            :app:testAppDebugUnitTest \
            --tests "io.legado.app.ui.main.explore.ExploreUpstreamReuseTest" \
            --tests "io.legado.app.enhance.explore.builder.ModernExploreClassificationEngineTest" \
            --tests "io.legado.app.enhance.explore.builder.ModernExploreControlExtractorTest" \
            --tests "io.legado.app.enhance.explore.builder.ModernExploreTreeControlTest" \
            --tests "io.legado.app.enhance.explore.screen.AdaptiveExploreControlRowsTest" \
            --no-daemon \
            --no-configuration-cache

      - name: Commit optimized sources to beta2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: reduce main page switching and background UI work'
          git push origin HEAD:beta2
