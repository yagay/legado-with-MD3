name: Debug Build on Push

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/modules/web/**'

permissions:
  contents: write

concurrency:
  group: debug-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply source-aware review audio once
        run: |
          if ! grep -q 'BookReviewAudioClick' app/src/main/java/io/legado/app/ui/book/info/BookInfoContract.kt; then
            python3 .github/scripts/upgrade_book_review_audio.py
            git config user.name Jie
            git config user.email 1614094+yagay@users.noreply.github.com
            git add app/src/main/java/io/legado/app/ui/book/info/BookInfoContract.kt \
                    app/src/main/java/io/legado/app/ui/book/info/BookInfoViewModel.kt \
                    app/src/main/java/io/legado/app/ui/book/info/BookInfoScreen.kt \
                    app/src/main/java/io/legado/app/ui/book/info/BookInfoReviewUi.kt \
                    app/src/main/java/io/legado/app/ui/book/info/BookInfoRouteScreen.kt
            git commit -m 'feat: match leg review audio playback'
            git push
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Remove Aliyun mirrors (unreliable in CI)
        run: |
          sed -i '/maven.aliyun.com/d' settings.gradle

      - name: Build Universal Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleAppDebug \
            -PenableAbiSplits=false \
            --no-daemon \
            --no-configuration-cache

      - name: Prepare direct-download APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/app/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" legado-debug-universal.apk

      - name: Upload Universal Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-universal-apk
          if-no-files-found: error
          path: legado-debug-universal.apk

      - name: Publish direct APK to debug-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view debug-latest >/dev/null 2>&1; then
            gh release upload debug-latest legado-debug-universal.apk --clobber
          else
            gh release create debug-latest legado-debug-universal.apk \
              --title "Debug Latest" \
              --notes "Latest universal Debug APK from main." \
              --prerelease \
              --target "${GITHUB_SHA}"
          fi
