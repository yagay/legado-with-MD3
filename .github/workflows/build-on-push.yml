name: Debug Build on Push

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/modules/web/**'
      - '.github/beta5-build-result.txt'

permissions:
  contents: write

concurrency:
  group: debug-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta5
        uses: actions/checkout@v5
        with:
          ref: beta5
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Remove Aliyun mirrors (unreliable in CI)
        run: |
          sed -i '/maven.aliyun.com/d' settings.gradle

      - name: Build beta5 Universal Debug APK
        id: assemble
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew assembleAppDebug \
            -PenableAbiSplits=false \
            --no-daemon \
            --no-configuration-cache 2>&1 | tee /tmp/beta5-assemble.log

      - name: Write beta5 diagnostic result to main
        if: ${{ always() }}
        env:
          OUTCOME: ${{ steps.assemble.outcome }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          {
            echo "outcome=$OUTCOME"
            echo "beta5_head=$(git rev-parse HEAD)"
            echo "---- compiler diagnostics ----"
            if [ "$OUTCOME" = "success" ]; then
              echo "ASSEMBLE SUCCESS"
            else
              grep -E '(^e: |error:|Unresolved reference|Cannot find a parameter|No value passed|None of the following|Type mismatch|Overload resolution ambiguity|Cannot infer|Conflicting overloads|Redeclaration|FAILURE:|Compilation error)' /tmp/beta5-assemble.log | head -n 160 || true
              echo "---- tail ----"
              tail -n 120 /tmp/beta5-assemble.log || true
            fi
          } > /tmp/beta5-build-result.txt

          git fetch origin main
          git switch main
          mkdir -p .github
          cp /tmp/beta5-build-result.txt .github/beta5-build-result.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/beta5-build-result.txt
          if ! git diff --cached --quiet; then
            git commit -m "ci: record beta5 build diagnostics [skip ci]"
            git push origin main
          fi

      - name: Fail when beta5 debug build failed
        if: ${{ steps.assemble.outcome != 'success' }}
        run: exit 1
