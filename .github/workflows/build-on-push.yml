name: Debug Build on Push

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/modules/web/**'

permissions:
  contents: write

concurrency:
  group: debug-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Remove Aliyun mirrors (unreliable in CI)
        run: |
          sed -i '/maven.aliyun.com/d' settings.gradle

      - name: Configure arm64-v8a Debug split
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/include("armeabi-v7a", "arm64-v8a")/include("arm64-v8a")/' app/build.gradle.kts
          sed -i 's/isUniversalApk = true/isUniversalApk = false/' app/build.gradle.kts

      - name: Build arm64-v8a Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleAppDebug \
            -PenableAbiSplits=true \
            --no-daemon \
            --no-configuration-cache

      - name: Prepare direct-download APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/app/debug -maxdepth 1 -type f -name '*arm64-v8a*.apk' | head -n 1)"
          test -n "$APK"
          ABIS="$(unzip -Z1 "$APK" | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u)"
          if [ -n "$ABIS" ] && [ "$ABIS" != "arm64-v8a" ]; then
            echo "Unexpected ABIs in APK: $ABIS"
            exit 1
          fi
          cp "$APK" legado-debug-arm64-v8a.apk

      - name: Upload arm64-v8a Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: legado-debug-arm64-v8a
          if-no-files-found: error
          path: legado-debug-arm64-v8a.apk

      - name: Publish direct APK to debug-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view debug-latest >/dev/null 2>&1; then
            gh release upload debug-latest legado-debug-arm64-v8a.apk --clobber
          else
            gh release create debug-latest legado-debug-arm64-v8a.apk \
              --title "Debug Latest" \
              --notes "Latest ARM64-v8a Debug APK from main." \
              --prerelease \
              --target "${GITHUB_SHA}"
          fi
