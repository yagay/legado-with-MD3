name: Build on Push

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/modules/web/**'

permissions:
  contents: write

concurrency:
  group: build-on-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/auto-release.yml
    with:
      publish: false
    secrets: inherit
