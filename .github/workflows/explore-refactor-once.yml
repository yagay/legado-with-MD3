name: One-time Explore Boundary Refactor
# corrected matcher run

on:
  push:
    branches:
      - beta
    paths:
      - '.github/workflows/explore-refactor-once.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: beta

      - name: Apply precise refactor
        run: python3 .github/scripts/explore_refactor_once.py

      - name: Commit and clean temporary files
        run: |
          git config user.name "Jie"
          git config user.email "1614094+yagay@users.noreply.github.com"
          git rm .github/workflows/explore-refactor-once.yml
          git rm .github/scripts/explore_refactor_once.py
          git add app/src/main/java/io/legado/app/ui/main/explore/ExploreViewModel.kt
          git add modules/legado-enhance/java/io/legado/app/enhance/explore/vm/ExploreViewModelEnhance.kt
          git diff --cached --check
          git commit -m "refactor(explore): route modern source behavior through shared runtime"
          git push origin HEAD:beta
