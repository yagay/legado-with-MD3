name: Sync upstream (ChatGPT)

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/sync-upstream-chatgpt.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-chatgpt
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/HapeLee/legado-with-MD3.git
          git fetch upstream main
          git merge -Xours --no-edit upstream/main
          git push origin HEAD:main

# Triggered through a short-lived PR so the push event is generated by GitHub.
