name: Build APK for User

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '要构建的分支'
        required: true
        default: 'trae/solo-agent-vhkVM3'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: Checkout stable debug signing key
        uses: actions/checkout@v5
        with:
          ref: main
          path: .debug-signing
          sparse-checkout: .github/legado-fixed-debug.jks.b64
          sparse-checkout-cone-mode: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clear 18PlusList.txt
        run: |
          echo "清空18PlusList.txt"
          echo "" > $GITHUB_WORKSPACE/app/src/main/assets/18PlusList.txt

      - name: Remove Aliyun mirrors (unreliable in CI)
        run: |
          sed -i '/maven.aliyun.com/d' settings.gradle

      - name: Prepare stable debug signing key
        shell: bash
        run: |
          set -euo pipefail
          base64 -d "$GITHUB_WORKSPACE/.debug-signing/.github/legado-fixed-debug.jks.b64" > "$GITHUB_WORKSPACE/app/legado-fixed-debug.jks"
          {
            echo ""
            echo "RELEASE_STORE_FILE=legado-fixed-debug.jks"
            echo "RELEASE_STORE_PASSWORD=legado-debug"
            echo "RELEASE_KEY_ALIAS=legado-debug"
            echo "RELEASE_KEY_PASSWORD=legado-debug"
          } >> "$GITHUB_WORKSPACE/gradle.properties"

      - name: Configure arm64-v8a Debug split
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/include("armeabi-v7a", "arm64-v8a")/include("arm64-v8a")/' app/build.gradle.kts
          sed -i 's/isUniversalApk = true/isUniversalApk = false/' app/build.gradle.kts

      - name: Build arm64-v8a Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleAppDebug -PenableAbiSplits=true --no-daemon --no-configuration-cache
        env:
          COMMIT_NUMBER: ${{ github.run_number }}
          APP_VERSION_NAME: debug-${{ github.run_number }}

      - name: Check Build Output
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$GITHUB_WORKSPACE/app/build/outputs/apk/app/debug"
          echo "检查 APK 输出目录: $APK_PATH"
          ls -la "$APK_PATH" || true
          APK="$(find "$APK_PATH" -maxdepth 1 -type f -name '*arm64-v8a*.apk' | head -n 1)"
          test -n "$APK"
          ABIS="$(unzip -Z1 "$APK" | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u)"
          if [ -n "$ABIS" ] && [ "$ABIS" != "arm64-v8a" ]; then
            echo "Unexpected ABIs in APK: $ABIS"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$APK" "$GITHUB_WORKSPACE/artifacts/legado-debug-arm64-v8a.apk"

      - name: Create ZIP Archive
        run: |
          cd "$GITHUB_WORKSPACE/artifacts"
          zip "$GITHUB_WORKSPACE/legado-debug-arm64-v8a.zip" legado-debug-arm64-v8a.apk
          ls -la "$GITHUB_WORKSPACE/legado-debug-arm64-v8a.zip"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: legado-debug-arm64-v8a
          path: artifacts/legado-debug-arm64-v8a.apk
          if-no-files-found: error

      - name: Upload ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: legado-debug-arm64-v8a-zip
          path: legado-debug-arm64-v8a.zip
          if-no-files-found: error
