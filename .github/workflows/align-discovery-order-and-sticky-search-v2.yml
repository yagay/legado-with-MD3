name: Align Discovery Order And Sticky Search V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/align-discovery-order-and-sticky-search-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Commit generated patch inputs
        shell: bash
        run: |
          git config user.name "Jie"
          git config user.email "1614094+yagay@users.noreply.github.com"
          git add .tmp/ExploreViewModelEnhance.kt app/src/main/java/io/legado/app/ui/main/explore/ExploreScreen.kt
          git diff --cached --quiet || git commit -m "fix: align waterfall filter order and pin source search"
          git push origin HEAD:main
