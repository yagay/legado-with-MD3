name: Temporary embedded explore search migration

on:
  push:
    branches: [ beta ]
    paths:
      - '.github/scripts/apply-embedded-explore-search.py'
      - '.github/workflows/temp-apply-embedded-explore-search.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: beta
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply migration
        run: python .github/scripts/apply-embedded-explore-search.py
      - name: Remove temporary migration files
        run: |
          git rm .github/scripts/apply-embedded-explore-search.py
          git rm .github/workflows/temp-apply-embedded-explore-search.yml
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/legado-enhance/java/io/legado/app/enhance/explore/vm/ExploreViewModelEnhance.kt
          git commit -m 'feat(explore): reuse embedded source search in waterfall'
          git push origin beta
