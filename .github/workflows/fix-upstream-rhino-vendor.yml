name: Complete upstream Rhino vendoring

on:
  push:
    branches: [ beta ]

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Copy complete TeamLegado Rhino source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/legado-upstream
          git clone --depth=1 --filter=blob:none --sparse https://github.com/LegadoTeam/legado.git /tmp/legado-upstream
          git -C /tmp/legado-upstream sparse-checkout set modules/rhino

          rm -rf modules/rhino-upstream/src/main/java
          mkdir -p modules/rhino-upstream/src/main
          cp -R /tmp/legado-upstream/modules/rhino/src/main/java modules/rhino-upstream/src/main/

          python3 - <<'PY'
          from pathlib import Path

          # Isolate only Legado's com.script implementation. org.htmlunit patch classes keep
          # their exact upstream package names because they extend the fork dependency itself.
          root = Path('modules/rhino-upstream/src/main/java/com/script')
          for p in list(root.rglob('*.kt')) + list(root.rglob('*.java')):
              s = p.read_text(encoding='utf-8')
              s = s.replace('com.script.', 'com.script.upstream.')
              s = s.replace('package com.script\n', 'package com.script.upstream\n')
              p.write_text(s, encoding='utf-8')

          bridge = Path('modules/rhino-upstream/src/main/java/com/script/upstream/bridge/UpstreamLegadoRuntime.kt')
          bridge.parent.mkdir(parents=True, exist_ok=True)
          bridge.write_text('''package com.script.upstream.bridge

          import com.script.upstream.ScriptBindings
          import com.script.upstream.rhino.RhinoScriptEngine

          /** Thin JVM-value facade over the vendored LegadoTeam Rhino runtime. */
          object UpstreamLegadoRuntime {
              fun eval(js: String, bindings: Map<String, Any?>): Any? {
                  val scriptBindings = ScriptBindings()
                  bindings.forEach { (key, value) -> scriptBindings[key] = value }
                  val scope = RhinoScriptEngine.getRuntimeScope(scriptBindings)
                  return RhinoScriptEngine.eval(js, scope)
              }
          }
          '''.replace('          ', ''), encoding='utf-8')
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules/rhino-upstream/src/main/java
          git diff --cached --quiet && exit 0
          git commit -m "fix: vendor complete TeamLegado Rhino source tree"
          git push
