name: Apply Source Kind Longpress Patch

on:
  push:
    branches: [ beta ]
    paths:
      - '.github/workflows/apply-source-kind-longpress.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply import fix
        run: python scripts/apply_source_kind_longpress.py
      - name: Commit import fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/io/legado/app/ui/main/explore/ExploreScreen.kt
          git commit -m 'fix(explore): import heightIn for source category sheet'
          git push origin HEAD:beta
