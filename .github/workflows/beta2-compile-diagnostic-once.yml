name: Beta2 Compile Diagnostic (one-shot)

on:
  push:
    branches:
      - beta2
    paths:
      - '.github/workflows/beta2-compile-diagnostic-once.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta2
        uses: actions/checkout@v5
        with:
          ref: beta2
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Remove Aliyun mirrors for CI
        run: sed -i '/maven.aliyun.com/d' settings.gradle

      - name: Compile and capture diagnostic
        id: compile
        shell: bash
        run: |
          set +e
          chmod +x gradlew
          ./gradlew :app:compileAppDebugKotlin \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace > beta2-compile.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "" >> beta2-compile.log
          echo "DIAGNOSTIC_EXIT_CODE=$status" >> beta2-compile.log
          exit 0

      - name: Save diagnostic and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/beta2-compile-diagnostic-once.yml
          git add beta2-compile.log .github/workflows/beta2-compile-diagnostic-once.yml
          git commit -m "chore: save beta2 compile diagnostic"
          git push origin HEAD:beta2

      - name: Fail job if compile failed
        if: steps.compile.outputs.exit_code != '0'
        run: exit 1
