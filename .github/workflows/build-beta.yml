name: Beta Build Verification

on:
  push:
    branches:
      - beta
    paths-ignore:
      - '**/modules/web/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply Rhino import compile fix
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/io/legado/app/ui/book/source/manage/BookSourceViewModel.kt')
          text = path.read_text()
          old = """            selectedItems.zip(sources).forEach { (wrapper, source) ->
                pendingImportJsEngineModes[source.bookSourceUrl]?.let { mode ->
                    SourceJsEngineModeStore.setMode(source.bookSourceUrl, mode)
                } ?: if (wrapper.oldData?.bookSourceUrl != source.bookSourceUrl) {
                    SourceJsEngineModeStore.clearMode(source.bookSourceUrl)
                }
            }
"""
          new = """            selectedItems.zip(sources).forEach { (wrapper, source) ->
                val importedMode = pendingImportJsEngineModes[source.bookSourceUrl]
                if (importedMode != null) {
                    SourceJsEngineModeStore.setMode(source.bookSourceUrl, importedMode)
                } else if (wrapper.oldData?.bookSourceUrl != source.bookSourceUrl) {
                    SourceJsEngineModeStore.clearMode(source.bookSourceUrl)
                }
            }
"""
          if new not in text:
              if old not in text:
                  raise SystemExit('target Rhino import block not found')
              path.write_text(text.replace(old, new, 1))
          PY
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add app/src/main/java/io/legado/app/ui/book/source/manage/BookSourceViewModel.kt
            git commit -m "fix: apply imported Rhino mode with statement branches"
            git push origin HEAD:beta
            exit 0
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Remove Aliyun mirrors (unreliable in CI)
        run: |
          sed -i '/maven.aliyun.com/d' settings.gradle

      - name: Run JavaScript compatibility tests
        run: |
          chmod +x gradlew
          ./gradlew \
            :modules:rhino-upstream:testDebugUnitTest \
            :app:testAppDebugUnitTest \
            --tests "com.script.upstream.bridge.UpstreamLegadoRuntimeTest" \
            --tests "io.legado.app.model.jsEngine.SourceJsEngineCompatibilityTest" \
            --no-daemon \
            --no-configuration-cache

      - name: Build Universal Debug APK
        run: |
          ./gradlew assembleAppDebug \
            -PenableAbiSplits=false \
            --no-daemon \
            --no-configuration-cache

      - name: Upload Universal Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: beta-debug-universal-apk
          if-no-files-found: error
          path: app/build/outputs/apk/app/debug/*.apk
