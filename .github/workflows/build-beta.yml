name: Beta Build Verification

on:
  push:
    branches:
      - beta
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-source-rhino-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Apply source Rhino selector
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, marker):
              p = Path(path); s = p.read_text(encoding='utf-8')
              if marker not in s:
                  if s.count(old) != 1: raise SystemExit(f'{path}: anchor mismatch')
                  s = s.replace(old, new, 1)
                  p.write_text(s, encoding='utf-8')

          # Contract
          path='app/src/main/java/io/legado/app/ui/book/source/edit/BookSourceEditContract.kt'
          replace_once(path,
              'import io.legado.app.ui.widget.components.variable.VariableEditorUiState\n',
              'import io.legado.app.ui.widget.components.variable.VariableEditorUiState\nimport io.legado.app.model.jsEngine.SourceJsEngineMode\n',
              'import io.legado.app.model.jsEngine.SourceJsEngineMode')
          replace_once(path,
              '    val bookSourceType: Int = 0,\n',
              '    val bookSourceType: Int = 0,\n    val jsEngineMode: SourceJsEngineMode = SourceJsEngineMode.LEGACY,\n',
              'val jsEngineMode:')
          replace_once(path,
              '    data class SetSourceType(val value: Int) : BookSourceEditIntent\n',
              '    data class SetSourceType(val value: Int) : BookSourceEditIntent\n    data class SetJsEngineMode(val value: SourceJsEngineMode) : BookSourceEditIntent\n',
              'data class SetJsEngineMode')

          # ViewModel
          path='app/src/main/java/io/legado/app/ui/book/source/edit/BookSourceEditViewModel.kt'
          replace_once(path,
              'import io.legado.app.model.SharedJsScope\n',
              'import io.legado.app.model.SharedJsScope\nimport io.legado.app.model.jsEngine.SourceJsEngineMode\nimport io.legado.app.model.jsEngine.SourceJsEngineModeStore\n',
              'import io.legado.app.model.jsEngine.SourceJsEngineModeStore')
          replace_once(path,
              '    private var baselineJson = ""\n',
              '    private var baselineJson = ""\n    private var baselineJsEngineMode = SourceJsEngineMode.LEGACY\n',
              'baselineJsEngineMode')
          replace_once(path,
              '            is BookSourceEditIntent.SetSourceType -> updateFlags { copy(bookSourceType = intent.value) }\n',
              '            is BookSourceEditIntent.SetSourceType -> updateFlags { copy(bookSourceType = intent.value) }\n            is BookSourceEditIntent.SetJsEngineMode -> updateFlags { copy(jsEngineMode = intent.value) }\n',
              'is BookSourceEditIntent.SetJsEngineMode')
          replace_once(path,
              '        if (asOriginal) baselineJson = GSON.toJson(source)\n        val tab = _uiState.value.selectedTab\n',
              '        if (asOriginal) baselineJson = GSON.toJson(source)\n        val jsEngineMode = SourceJsEngineModeStore.getMode(source.getKey())\n        if (asOriginal) baselineJsEngineMode = jsEngineMode\n        val tab = _uiState.value.selectedTab\n',
              'val jsEngineMode = SourceJsEngineModeStore.getMode(source.getKey())')
          replace_once(path,
              '            bookSourceType = source.bookSourceType,\n',
              '            bookSourceType = source.bookSourceType,\n            jsEngineMode = jsEngineMode,\n',
              'jsEngineMode = jsEngineMode')
          replace_once(path,
              '    private fun isDirty(state: BookSourceEditUiState): Boolean =\n        GSON.toJson(currentSource(state)) != baselineJson\n',
              '    private fun isDirty(state: BookSourceEditUiState): Boolean =\n        GSON.toJson(currentSource(state)) != baselineJson ||\n            state.jsEngineMode != baselineJsEngineMode\n',
              'state.jsEngineMode != baselineJsEngineMode')
          replace_once(path,
              '            repository.insert(source)\n            concurrentRecordMap.remove(source.bookSourceUrl)\n                originalSource = source\n                baselineJson = GSON.toJson(source)\n',
              '            repository.insert(source)\n            concurrentRecordMap.remove(source.bookSourceUrl)\n                val selectedJsEngineMode = _uiState.value.jsEngineMode\n                originalSource?.bookSourceUrl?.takeIf { it != source.bookSourceUrl }?.let {\n                    SourceJsEngineModeStore.clearMode(it)\n                }\n                SourceJsEngineModeStore.setMode(source.bookSourceUrl, selectedJsEngineMode)\n                originalSource = source\n                baselineJson = GSON.toJson(source)\n                baselineJsEngineMode = selectedJsEngineMode\n',
              'SourceJsEngineModeStore.setMode(source.bookSourceUrl, selectedJsEngineMode)')

          # Screen
          path='app/src/main/java/io/legado/app/ui/book/source/edit/BookSourceEditScreen.kt'
          replace_once(path,
              'import io.legado.app.R\n',
              'import io.legado.app.R\nimport io.legado.app.model.jsEngine.SourceJsEngineMode\n',
              'import io.legado.app.model.jsEngine.SourceJsEngineMode')
          replace_once(path,
              '    var typeMenuExpanded by remember { mutableStateOf(false) }\n',
              '    var typeMenuExpanded by remember { mutableStateOf(false) }\n    var jsEngineMenuExpanded by remember { mutableStateOf(false) }\n',
              'jsEngineMenuExpanded')
          p=Path(path); s=p.read_text(encoding='utf-8')
          marker='title = "JavaScript / Rhino"'
          if marker not in s:
              anchor='''        Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {\n            SourceEditOptionCard(\n                title = stringResource(R.string.auto_save_cookie),\n                checked = state.enabledCookieJar,\n                modifier = Modifier.weight(1f),\n                onClick = { onIntent(BookSourceEditIntent.SetCookieJarEnabled(!state.enabledCookieJar)) },\n            )\n            SourceEditOptionCard(\n                title = stringResource(R.string.is_event_listener),\n                checked = state.eventListener,\n                modifier = Modifier.weight(1f),\n                onClick = { onIntent(BookSourceEditIntent.SetEventListener(!state.eventListener)) },\n            )\n            SourceEditOptionCard(\n                title = stringResource(R.string.custom_button),\n                checked = state.customButton,\n                modifier = Modifier.weight(1f),\n                onClick = { onIntent(BookSourceEditIntent.SetCustomButton(!state.customButton)) },\n            )\n        }\n'''
              if s.count(anchor)!=1: raise SystemExit('screen option anchor mismatch')
              extra='''        Box(modifier = Modifier.fillMaxWidth()) {\n            SourceEditOptionCard(\n                title = "JavaScript / Rhino",\n                subtitle = if (state.jsEngineMode == SourceJsEngineMode.LEGACY) "Legacy Rhino" else "Modern Rhino",\n                modifier = Modifier.fillMaxWidth(),\n                onClick = { jsEngineMenuExpanded = true },\n            )\n            RoundDropdownMenu(expanded = jsEngineMenuExpanded, onDismissRequest = { jsEngineMenuExpanded = false }) {\n                SourceJsEngineMode.entries.forEach { mode ->\n                    val title = if (mode == SourceJsEngineMode.LEGACY) "Legacy Rhino" else "Modern Rhino"\n                    RoundDropdownMenuItem(\n                        text = title,\n                        isSelected = state.jsEngineMode == mode,\n                        onClick = {\n                            jsEngineMenuExpanded = false\n                            onIntent(BookSourceEditIntent.SetJsEngineMode(mode))\n                        },\n                    )\n                }\n            }\n        }\n'''
              s=s.replace(anchor,anchor+extra,1); p.write_text(s,encoding='utf-8')

          # Router diagnostics
          path='app/src/main/java/io/legado/app/model/jsEngine/SourceJsEngine.kt'
          replace_once(path,
              'import io.legado.app.data.entities.BaseSource\n',
              'import io.legado.app.data.entities.BaseSource\nimport io.legado.app.constant.AppLog\n',
              'import io.legado.app.constant.AppLog')
          p=Path(path); s=p.read_text(encoding='utf-8')
          if 'JavaScript [${mode.name}]' not in s:
              old='''        return when (SourceJsEngineModeStore.getMode(source.getKey())) {\n            SourceJsEngineMode.LEGACY -> LegacySourceJsEngine.eval(source, jsStr, bindingsConfig)\n            SourceJsEngineMode.MODERN -> ModernSourceJsEngine.eval(source, jsStr, bindingsConfig)\n        }\n'''
              new='''        val mode = SourceJsEngineModeStore.getMode(source.getKey())\n        return try {\n            when (mode) {\n                SourceJsEngineMode.LEGACY -> LegacySourceJsEngine.eval(source, jsStr, bindingsConfig)\n                SourceJsEngineMode.MODERN -> ModernSourceJsEngine.eval(source, jsStr, bindingsConfig)\n            }\n        } catch (error: Exception) {\n            AppLog.put("JavaScript [${mode.name}] ${source.getTag()}\\n$error", error)\n            throw error\n        }\n'''
              if s.count(old)!=1: raise SystemExit('router eval anchor mismatch')
              s=s.replace(old,new,1); p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/io/legado/app/ui/book/source/edit/BookSourceEditContract.kt app/src/main/java/io/legado/app/ui/book/source/edit/BookSourceEditViewModel.kt app/src/main/java/io/legado/app/ui/book/source/edit/BookSourceEditScreen.kt app/src/main/java/io/legado/app/model/jsEngine/SourceJsEngine.kt
          git commit -m "feat: add per-source Rhino selector and diagnostics"
          git push origin HEAD:beta
