name: Beta Build Verification

on:
  push:
    branches:
      - beta
    paths-ignore:
      - '**/modules/web/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply AnalyzeRule coroutine context propagation
        run: |
          sed -i '/import io.legado.app.model.jsEngine.SourceJsEngineModeStore/a import io.legado.app.model.jsEngine.SourceJsEngineRouter' app/src/main/java/io/legado/app/model/analyzeRule/AnalyzeRule.kt
          python3 -c "from pathlib import Path; import base64; p=Path('app/src/main/java/io/legado/app/model/analyzeRule/AnalyzeRule.kt'); s=p.read_text(); old=base64.b64decode('').decode(); new=base64.b64decode('').decode(); assert old in s or new in s, 'AnalyzeRule MODERN block not found'; p.write_text(s if new in s else s.replace(old,new,1))"
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add app/src/main/java/io/legado/app/model/analyzeRule/AnalyzeRule.kt
            git commit -m "fix: propagate AnalyzeRule coroutine context upstream"
            git push origin HEAD:beta
            exit 0
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Remove Aliyun mirrors (unreliable in CI)
        run: |
          sed -i '/maven.aliyun.com/d' settings.gradle

      - name: Run JavaScript compatibility tests
        timeout-minutes: 30
        run: |
          chmod +x gradlew
          ./gradlew \
            :modules:rhino-upstream:testDebugUnitTest \
            :app:testAppDebugUnitTest \
            --tests "com.script.upstream.bridge.UpstreamLegadoRuntimeTest" \
            --tests "io.legado.app.model.jsEngine.SourceJsEngineCompatibilityTest" \
            --no-daemon \
            --no-configuration-cache

      - name: Build Universal Debug APK
        run: |
          ./gradlew assembleAppDebug \
            -PenableAbiSplits=false \
            --no-daemon \
            --no-configuration-cache

      - name: Upload Universal Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: beta-debug-universal-apk
          if-no-files-found: error
          path: app/build/outputs/apk/app/debug/*.apk
