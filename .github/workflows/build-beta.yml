name: Beta Build Verification

on:
  push:
    branches:
      - beta
      - beta2
    paths-ignore:
      - '**/modules/web/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply pending beta2 performance patches
        if: github.ref == 'refs/heads/beta2'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          bookshelf_vm = Path('app/src/main/java/io/legado/app/ui/main/bookshelf/BookshelfViewModel.kt')
          text = bookshelf_vm.read_text()
          text = text.replace('SharingStarted.WhileSubscribed(5000)', 'SharingStarted.WhileSubscribed()')
          bookshelf_vm.write_text(text)

          explore_show = Path('app/src/main/java/io/legado/app/ui/book/explore/ExploreShowScreen.kt')
          text = explore_show.read_text()
          old = 'key = { index, item -> "${item.book.bookUrl}:$index" }'
          if text.count(old) != 2:
              raise SystemExit(f'ExploreShowScreen expected 2 index keys, found {text.count(old)}')
          text = text.replace(old, 'key = { _, item -> item.book.bookUrl }')
          explore_show.write_text(text)

          bookshelf_screen = Path('app/src/main/java/io/legado/app/ui/main/bookshelf/BookshelfScreen.kt')
          text = bookshelf_screen.read_text()
          pattern = r'pagerState\.animateScrollToPage\(\s*index\s*\)'
          text, count = re.subn(pattern, 'pagerState.scrollToPage(index)', text)
          if count != 2:
              raise SystemExit(f'BookshelfScreen expected 2 tab-click animations, found {count}')
          bookshelf_screen.write_text(text)
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Remove Aliyun mirrors (unreliable in CI)
        run: |
          sed -i '/maven.aliyun.com/d' settings.gradle

      - name: Run JavaScript compatibility tests
        timeout-minutes: 30
        run: |
          chmod +x gradlew
          ./gradlew \
            :modules:rhino-upstream:testDebugUnitTest \
            :app:testAppDebugUnitTest \
            --tests "com.script.upstream.bridge.UpstreamLegadoRuntimeTest" \
            --tests "io.legado.app.model.jsEngine.SourceJsEngineCompatibilityTest" \
            --tests "io.legado.app.model.jsEngine.SourceJsEngineLifecycleTest" \
            --tests "io.legado.app.model.jsEngine.AnalyzeUrlUpstreamCompatibilityTest" \
            --tests "io.legado.app.ui.main.explore.ExploreUpstreamReuseTest" \
            --tests "io.legado.app.enhance.explore.builder.ModernExploreClassificationEngineTest" \
            --tests "io.legado.app.enhance.explore.builder.ModernExploreControlExtractorTest" \
            --tests "io.legado.app.enhance.explore.builder.ModernExploreTreeControlTest" \
            --tests "io.legado.app.enhance.explore.screen.AdaptiveExploreControlRowsTest" \
            --no-daemon \
            --no-configuration-cache

      - name: Build Universal Debug APK
        run: |
          ./gradlew assembleAppDebug \
            -PenableAbiSplits=false \
            --no-daemon \
            --no-configuration-cache

      - name: Upload Universal Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: beta-debug-universal-apk
          if-no-files-found: error
          path: app/build/outputs/apk/app/debug/*.apk

      - name: Commit verified beta2 performance patches
        if: github.ref == 'refs/heads/beta2'
        shell: bash
        run: |
          git add \
            app/src/main/java/io/legado/app/ui/main/bookshelf/BookshelfViewModel.kt \
            app/src/main/java/io/legado/app/ui/main/bookshelf/BookshelfScreen.kt \
            app/src/main/java/io/legado/app/ui/book/explore/ExploreShowScreen.kt
          if git diff --cached --quiet; then
            echo 'No pending beta2 performance patches.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: finish beta2 main-screen performance pass'
          git push origin HEAD:beta2
