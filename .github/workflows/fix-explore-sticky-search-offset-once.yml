name: One-time Explore Sticky Search Offset Fix

on:
  push:
    branches: [ beta ]
    paths:
      - '.github/workflows/fix-explore-sticky-search-offset-once.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: beta
      - name: Keep search sticky without covering selected source
        run: python .github/scripts/fix-explore-sticky-search-offset.py
      - name: Commit fix and remove temporary files
        run: |
          rm .github/scripts/fix-explore-sticky-search-offset.py
          rm .github/workflows/fix-explore-sticky-search-offset-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(explore): keep source search sticky without overlap"
          git push origin beta
