name: Fix Slider Preview Session

on:
  push:
    branches: [ beta ]
    paths:
      - '.github/workflows/fix-slider-preview-session.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python scripts/fix_slider_preview_session.py
      - name: Commit patch and remove temporary files
        run: |
          rm scripts/fix_slider_preview_session.py
          rm .github/workflows/fix-slider-preview-session.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(explore): keep slider preview session stable'
          git push origin HEAD:beta
