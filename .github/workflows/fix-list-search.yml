name: Fix Discovery List Search

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-list-search.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Restore upstream list-search routing
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/io/legado/app/ui/main/explore/ExploreViewModel.kt')
          text = path.read_text()
          old = '''    fun onIntent(intent: ExploreIntent) {
        if (enhance.onIntent(intent)) return
        when (intent) {
'''
          new = '''    fun onIntent(intent: ExploreIntent) {
        // Search is owned by the base ExploreViewModel, matching upstream.
        // The base search() already branches by layoutMode: list filters sources,
        // waterfall delegates to enhance.searchSuiteBooks(). Do not let the
        // enhancement interceptor swallow Search before this routing runs.
        if (intent !is ExploreIntent.Search && enhance.onIntent(intent)) return
        when (intent) {
'''
          if old not in text:
              raise SystemExit('onIntent routing block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Jie"
          git config user.email "1614094+yagay@users.noreply.github.com"
          git add app/src/main/java/io/legado/app/ui/main/explore/ExploreViewModel.kt
          git diff --cached --quiet || git commit -m "fix: restore discovery list search"
          git push origin HEAD:main
