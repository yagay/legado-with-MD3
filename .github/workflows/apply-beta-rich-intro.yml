name: Apply Beta Rich Intro Integration

on:
  push:
    branches:
      - beta
    paths:
      - .github/workflows/apply-beta-rich-intro.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta
        uses: actions/checkout@v5
        with:
          ref: beta
          fetch-depth: 0

      - name: Apply exact BookInfoScreen integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/io/legado/app/ui/book/info/BookInfoScreen.kt')
          text = path.read_text(encoding='utf-8')
          old = '''        AnimatedTextLine(
            text = book.displayIntro.orEmpty().ifBlank { stringResource(R.string.intro_show_null) },
            style = LegadoTheme.typography.bodyMedium,
        )'''
          new = '''        BookIntroContent(
            text = book.displayIntro.orEmpty().ifBlank { stringResource(R.string.intro_show_null) },
            baseUrl = book.bookUrl,
        )'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one intro block, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/apply-beta-rich-intro.yml
          git diff --check

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile integration
        shell: bash
        run: |
          sed -i '/maven.aliyun.com/d' settings.gradle
          chmod +x gradlew
          ./gradlew compileAppDebugKotlin \
            -PenableAbiSplits=false \
            --no-daemon \
            --no-configuration-cache

      - name: Commit validated integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/io/legado/app/ui/book/info/BookInfoScreen.kt .github/workflows/apply-beta-rich-intro.yml
          git commit -m "integrate rich book intro renderer"
          git push origin HEAD:beta
