name: Patch AnalyzeRule upstream context

on:
  push:
    branches: [beta]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: beta
          fetch-depth: 0
      - name: Patch AnalyzeRule context propagation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/io/legado/app/model/analyzeRule/AnalyzeRule.kt')
          s = p.read_text()
          old_import = 'import io.legado.app.model.jsEngine.SourceJsEngineModeStore\n'
          new_import = old_import + 'import io.legado.app.model.jsEngine.SourceJsEngineRouter\n'
          if 'import io.legado.app.model.jsEngine.SourceJsEngineRouter\n' not in s:
              if old_import not in s:
                  raise SystemExit('engine import anchor not found')
              s = s.replace(old_import, new_import, 1)
          old = '''            return source.evalJS(jsStr) {
                put("java", this@AnalyzeRule)
                put("source", source)
                put("book", book)
                put("result", result)
                put("baseUrl", baseUrl)
                put("chapter", chapter)
                put("title", chapter?.title)
                put("src", content)
                put("nextChapterUrl", nextChapterUrl)
                put("rssArticle", rssArticle)
                put("fromBookInfo", isFromBookInfo)
                localBindings["paraIndex"]?.let { put("paraIndex", it) }
                localBindings["paraData"]?.let { put("paraData", it) }
                localBindings["page"]?.let { put("page", it.toIntOrNull() ?: it) }
            }
'''
          new = '''            return SourceJsEngineRouter.eval(
                source,
                jsStr,
                {
                    put("java", this@AnalyzeRule)
                    put("source", source)
                    put("book", book)
                    put("result", result)
                    put("baseUrl", baseUrl)
                    put("chapter", chapter)
                    put("title", chapter?.title)
                    put("src", content)
                    put("nextChapterUrl", nextChapterUrl)
                    put("rssArticle", rssArticle)
                    put("fromBookInfo", isFromBookInfo)
                    localBindings["paraIndex"]?.let { put("paraIndex", it) }
                    localBindings["paraData"]?.let { put("paraData", it) }
                    localBindings["page"]?.let { put("page", it.toIntOrNull() ?: it) }
                },
                coroutineContext,
            )
'''
          if new not in s:
              if old not in s:
                  raise SystemExit('AnalyzeRule MODERN eval block not found')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/io/legado/app/model/analyzeRule/AnalyzeRule.kt
          git commit -m "fix: propagate AnalyzeRule coroutine context upstream"
          git push origin HEAD:beta
