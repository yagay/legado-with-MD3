name: One-shot source group filter fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-fix-source-group-filter.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply minimal group filter fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/io/legado/app/ui/book/source/manage/BookSourceViewModel.kt')
          text = path.read_text(encoding='utf-8')
          old = '''else -> filter.startsWith(BookSourceViewModel.PREFIX_GROUP) && source.bookSourceGroup?.split(
                          ","
                      )?.contains(filter.removePrefix(BookSourceViewModel.PREFIX_GROUP)) == true'''
          new = '''else -> filter.startsWith(BookSourceViewModel.PREFIX_GROUP) && source.bookSourceGroup
                          ?.splitNotBlank(AppPattern.splitGroupRegex)
                          ?.contains(filter.removePrefix(BookSourceViewModel.PREFIX_GROUP)) == true'''
          if old not in text:
              raise SystemExit('target group filter code not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-fix-source-group-filter.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: use shared group separator rules in source filters"
          git push
