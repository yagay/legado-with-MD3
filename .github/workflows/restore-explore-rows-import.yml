name: Restore Explore Rows Import

on:
  push:
    branches: [ beta ]
    paths:
      - '.github/workflows/restore-explore-rows-import.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply fix
        run: python scripts/restore_explore_rows_import.py
      - name: Commit fix and remove temporary files
        run: |
          rm scripts/restore_explore_rows_import.py
          rm .github/workflows/restore-explore-rows-import.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(explore): restore shared row helper import'
          git push origin HEAD:beta
