name: One-shot HtmlFormatter Repair

on:
  push:
    branches: [beta]
    paths: ['.github/beta-htmlformatter-trigger']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: beta
          fetch-depth: 0
      - name: Restore formatter from main and add upstream intro API
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          git checkout origin/main -- app/src/main/java/io/legado/app/utils/HtmlFormatter.kt
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/io/legado/app/utils/HtmlFormatter.kt')
          text = p.read_text(encoding='utf-8')
          old = '''    fun format(html: String?, otherRegex: Regex = otherHtmlRegex): String =\n        format(html, otherRegex, "　　")\n\n    private fun format(html: String?, otherRegex: Regex, paragraphIndent: String): String {'''
          new = '''    fun format(html: String?, otherRegex: Regex = otherHtmlRegex): String =\n        format(html, otherRegex, "　　")\n\n    /** 与 Legado 上游一致：简介纯文本格式化保留换行，但不自动添加段首缩进。 */\n    fun formatIntro(html: String?): String =\n        format(html, otherHtmlRegex, "")\n\n    private fun format(html: String?, otherRegex: Regex, paragraphIndent: String): String {'''
          if old not in text:
              raise SystemExit('HtmlFormatter insertion point not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit clean repair
        shell: bash
        run: |
          rm -f .github/workflows/beta-htmlformatter-fix.yml .github/beta-htmlformatter-trigger .github/beta-build-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "repair HtmlFormatter with minimal upstream intro API"
          git push origin HEAD:beta
