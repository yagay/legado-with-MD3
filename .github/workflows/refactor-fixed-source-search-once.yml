name: One-time Fixed Source Search Refactor

on:
  push:
    branches: [ beta ]
    paths:
      - '.github/workflows/refactor-fixed-source-search-once.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: beta
      - name: Separate fixed search header from source list
        run: python .github/scripts/refactor-fixed-source-search.py
      - name: Commit refactor and remove temporary files
        run: |
          rm .github/scripts/refactor-fixed-source-search.py
          rm .github/workflows/refactor-fixed-source-search-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(explore): decouple fixed source search from list position"
          git push origin beta
