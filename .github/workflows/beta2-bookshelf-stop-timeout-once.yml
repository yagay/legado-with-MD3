name: Beta2 Bookshelf Stop Timeout (one-shot)

# retrigger
on:
  push:
    branches:
      - beta2
    paths:
      - '.github/workflows/beta2-bookshelf-stop-timeout-once.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta2
        uses: actions/checkout@v5
        with:
          ref: beta2
          fetch-depth: 0

      - name: Stop bookshelf UI flows immediately when hidden
        shell: bash
        run: |
          set -euo pipefail
          FILE='app/src/main/java/io/legado/app/ui/main/bookshelf/BookshelfViewModel.kt'
          COUNT="$(grep -o 'SharingStarted\.WhileSubscribed(5000)' "$FILE" | wc -l)"
          test "$COUNT" -ge 1
          sed -i 's/SharingStarted\.WhileSubscribed(5000)/SharingStarted.WhileSubscribed()/g' "$FILE"
          ! grep -q 'SharingStarted\.WhileSubscribed(5000)' "$FILE"
          rm -f .github/workflows/beta2-bookshelf-stop-timeout-once.yml

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Remove Aliyun mirrors for CI
        run: sed -i '/maven.aliyun.com/d' settings.gradle

      - name: Compile
        timeout-minutes: 45
        run: |
          chmod +x gradlew
          ./gradlew assembleAppDebug \
            -PenableAbiSplits=false \
            --no-daemon \
            --no-configuration-cache

      - name: Commit verified optimization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: stop bookshelf UI flows immediately when hidden'
          git push origin HEAD:beta2
