name: Apply formatJs Rhino Router

on:
  push:
    branches: [ beta ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Route formatJs through source engine
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/io/legado/app/model/webBook/BookChapterList.kt')
          s = p.read_text(encoding='utf-8')
          old = '''                    RhinoScriptEngine.runCatching {\n                        eval(formatJs, bindings)?.toString()?.let {\n                            bookChapter.title = it\n                        }\n                    }.onFailure {\n'''
          new = '''                    runCatching {\n                        bookSource.evalJS(formatJs) {\n                            put("gInt", bindings["gInt"])\n                            put("index", bindings["index"])\n                            put("chapter", bindings["chapter"])\n                            put("title", bindings["title"])\n                        }?.toString()?.let {\n                            bookChapter.title = it\n                        }\n                    }.onFailure {\n'''
          if old not in s:
              raise SystemExit('formatJs execution anchor not found')
          s = s.replace(old, new, 1)
          # imports no longer needed for direct legacy execution
          s = s.replace('import com.script.rhino.RhinoScriptEngine\n', '')
          s = s.replace('import org.mozilla.javascript.Context\n', '')
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/io/legado/app/model/webBook/BookChapterList.kt
          git diff --cached --quiet && exit 0
          git commit -m "fix: route toc formatJs through source Rhino engine"
          git push
