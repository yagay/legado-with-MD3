name: Patch Rhino import compile fix

on:
  push:
    branches:
      - beta

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Fix Kotlin import mode branch
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/io/legado/app/ui/book/source/manage/BookSourceViewModel.kt')
          text = path.read_text()
          old = """            selectedItems.zip(sources).forEach { (wrapper, source) ->
                pendingImportJsEngineModes[source.bookSourceUrl]?.let { mode ->
                    SourceJsEngineModeStore.setMode(source.bookSourceUrl, mode)
                } ?: if (wrapper.oldData?.bookSourceUrl != source.bookSourceUrl) {
                    SourceJsEngineModeStore.clearMode(source.bookSourceUrl)
                }
            }
"""
          new = """            selectedItems.zip(sources).forEach { (wrapper, source) ->
                val importedMode = pendingImportJsEngineModes[source.bookSourceUrl]
                if (importedMode != null) {
                    SourceJsEngineModeStore.setMode(source.bookSourceUrl, importedMode)
                } else if (wrapper.oldData?.bookSourceUrl != source.bookSourceUrl) {
                    SourceJsEngineModeStore.clearMode(source.bookSourceUrl)
                }
            }
"""
          if new not in text:
              if old not in text:
                  raise SystemExit('target Rhino import block not found')
              path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/io/legado/app/ui/book/source/manage/BookSourceViewModel.kt
          git commit -m "fix: apply imported Rhino mode with statement branches"
          git push origin HEAD:beta
