name: One-time Explore Source Menu Refactor

on:
  push:
    branches: [ beta ]
    paths:
      - '.github/workflows/refactor-explore-source-menu-once.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: beta
      - name: Refactor shared source menu
        run: python3 .github/scripts/refactor_explore_source_menu_once.py
      - name: Commit refactor and remove temporary files
        run: |
          rm .github/scripts/refactor_explore_source_menu_once.py
          rm .github/workflows/refactor-explore-source-menu-once.yml
          git config user.name "Jie"
          git config user.email "1614094+yagay@users.noreply.github.com"
          git add -A
          git commit -m "refactor(explore): reuse shared source action menu"
          git push origin HEAD:beta
