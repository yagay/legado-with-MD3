name: Patch Waterfall Search Scope

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-waterfall-search-scope.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Apply patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ExploreScreen: opaque sticky search + scope selector in search trailing icon.
          p = Path('app/src/main/java/io/legado/app/ui/main/explore/ExploreScreen.kt')
          s = p.read_text()
          s = s.replace('import androidx.compose.foundation.layout.Box\n', 'import androidx.compose.foundation.background\nimport androidx.compose.foundation.layout.Box\n')
          s = s.replace('import androidx.compose.material.icons.filled.Group\n', 'import androidx.compose.material.icons.filled.Group\nimport androidx.compose.material.icons.filled.FilterAlt\n')
          s = s.replace('''                            modifier = Modifier
                                .fillMaxWidth()
                                .padding(horizontal = 12.dp, vertical = 6.dp),''', '''                            modifier = Modifier
                                .fillMaxWidth()
                                .background(MaterialTheme.colorScheme.surface)
                                .padding(horizontal = 12.dp, vertical = 6.dp),''', 1)
          old = '''        onSearchQueryChange = { onIntent(ExploreIntent.Search(it)) },
        onSearchToggle = { onIntent(ExploreIntent.ToggleSearch(it)) },
        searchPlaceholder = stringResource(R.string.search),
        topBarActions = {'''
          new = '''        onSearchQueryChange = { onIntent(ExploreIntent.Search(it)) },
        onSearchToggle = { onIntent(ExploreIntent.ToggleSearch(it)) },
        searchTrailingIcon = if (state.layoutMode == 1) {
            {
                var showSearchScopeMenu by remember { mutableStateOf(false) }
                Box {
                    TopBarActionButton(
                        onClick = { showSearchScopeMenu = true },
                        imageVector = Icons.Default.FilterAlt,
                        contentDescription = when (state.enhance.suiteSearchField) {
                            "author" -> "搜索作者"
                            "kind" -> "搜索分类"
                            else -> "搜索书籍名"
                        }
                    )
                    RoundDropdownMenu(
                        expanded = showSearchScopeMenu,
                        onDismissRequest = { showSearchScopeMenu = false }
                    ) {
                        listOf(
                            "name" to "书籍名",
                            "author" to "作者",
                            "kind" to "分类"
                        ).forEach { (field, label) ->
                            RoundDropdownMenuItem(
                                text = label,
                                isSelected = state.enhance.suiteSearchField == field,
                                onClick = {
                                    onIntent(ExploreIntent.SetSuiteSearchField(field))
                                    showSearchScopeMenu = false
                                }
                            )
                        }
                    }
                }
            }
        } else null,
        searchPlaceholder = if (state.layoutMode == 1) {
            when (state.enhance.suiteSearchField) {
                "author" -> "搜索作者"
                "kind" -> "搜索分类"
                else -> "搜索书籍名"
            }
        } else stringResource(R.string.search),
        topBarActions = {'''
          if old not in s: raise SystemExit('ExploreScreen search block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # ExploreViewModel: new intent reaches enhance; Search remains base-routed.
          p = Path('app/src/main/java/io/legado/app/ui/main/explore/ExploreViewModel.kt')
          s = p.read_text()
          needle = '    data object LoadMoreSuiteSearch : ExploreIntent\n'
          if needle not in s: raise SystemExit('ExploreIntent insertion not found')
          s = s.replace(needle, needle + '    data class SetSuiteSearchField(val field: String) : ExploreIntent\n', 1)
          p.write_text(s)

          # Enhance VM: state + intent + scoped filtering.
          p = Path('modules/legado-enhance/java/io/legado/app/enhance/explore/vm/ExploreViewModelEnhance.kt')
          s = p.read_text()
          s = s.replace('''    val suiteSearchRemote: Boolean = false,
    val suiteSearchPage: Int = 1,''', '''    val suiteSearchRemote: Boolean = false,
    /** 瀑布流搜索字段：name(默认) / author / kind */
    val suiteSearchField: String = "name",
    val suiteSearchPage: Int = 1,''', 1)
          s = s.replace('''            is ExploreIntent.LoadMoreSuiteSearch -> loadMoreSuiteSearch()
            is ExploreIntent.ToggleCategorySheet ->''', '''            is ExploreIntent.LoadMoreSuiteSearch -> loadMoreSuiteSearch()
            is ExploreIntent.SetSuiteSearchField -> setSuiteSearchField(intent.field)
            is ExploreIntent.ToggleCategorySheet ->''', 1)
          marker = '''    fun searchSuiteBooks(query: String) {
'''
          method = '''    private fun setSuiteSearchField(field: String) {
        val normalized = field.takeIf { it == "name" || it == "author" || it == "kind" } ?: "name"
        if (vm.uiState.value.enhance.suiteSearchField == normalized) return
        vm.updateUiState { state ->
            state.copy(
                enhance = state.enhance.copy(
                    suiteSearchField = normalized,
                    suiteSearchBooks = null,
                    suiteSearchLoading = false,
                    suiteSearchRemote = false,
                    suiteSearchPage = 1,
                    suiteSearchIsEnd = true
                )
            )
        }
        val query = vm.uiState.value.searchKey.trim()
        if (query.isNotBlank()) searchSuiteBooks(query)
    }

'''
          if marker not in s: raise SystemExit('searchSuiteBooks marker missing')
          s = s.replace(marker, method + marker, 1)
          s = s.replace('''            val localMatches = filterLoadedSuiteBooks(state, suite, query)

            if (!source?.searchUrl.isNullOrBlank()) {''', '''            val field = state.enhance.suiteSearchField
            val localMatches = filterLoadedSuiteBooks(state, suite, query, field)

            // 书源 searchUrl 通常只定义关键字/书名搜索；作者和分类范围仅过滤已加载书籍，
            // 避免把作者/分类关键字错误发送给远端书名搜索接口。
            if (field == "name" && !source?.searchUrl.isNullOrBlank()) {''', 1)
          old_filter = '''    private fun filterLoadedSuiteBooks(
        state: ExploreViewModel.ExploreUiState,
        suite: DiscoverySuite,
        query: String
    ): List<SearchBook> {
'''
          new_filter = '''    private fun filterLoadedSuiteBooks(
        state: ExploreViewModel.ExploreUiState,
        suite: DiscoverySuite,
        query: String,
        field: String = state.enhance.suiteSearchField
    ): List<SearchBook> {
'''
          if old_filter not in s: raise SystemExit('filter signature missing')
          s = s.replace(old_filter, new_filter, 1)
          old_body = '''        val q = query.lowercase()
        return loadedBooks.filter { book ->
            book.name.contains(query, ignoreCase = true) ||
                    book.author.contains(query, ignoreCase = true) ||
                    book.kind.orEmpty().contains(query, ignoreCase = true) ||
                    book.intro.orEmpty().contains(query, ignoreCase = true) ||
                    book.latestChapterTitle.orEmpty().contains(query, ignoreCase = true) ||
                    book.wordCount.orEmpty().lowercase().contains(q)
        }
'''
          new_body = '''        return loadedBooks.filter { book ->
            when (field) {
                "author" -> book.author.contains(query, ignoreCase = true)
                "kind" -> book.kind.orEmpty().contains(query, ignoreCase = true)
                else -> book.name.contains(query, ignoreCase = true)
            }
        }
'''
          if old_body not in s: raise SystemExit('old filter body missing')
          s = s.replace(old_body, new_body, 1)
          p.write_text(s)

          # Copy enhanced VM out so the connector can write it to legado-enhance/MD3.
          out = Path('.tmp/ExploreViewModelEnhance.kt')
          out.parent.mkdir(exist_ok=True)
          out.write_text(p.read_text())
          PY
      - name: Commit generated main changes
        run: |
          git config user.name Jie
          git config user.email '1614094+yagay@users.noreply.github.com'
          git add app/src/main/java/io/legado/app/ui/main/explore/ExploreScreen.kt \
                  app/src/main/java/io/legado/app/ui/main/explore/ExploreViewModel.kt \
                  .tmp/ExploreViewModelEnhance.kt
          git commit -m 'feat: add scoped waterfall search' || exit 0
          git push
