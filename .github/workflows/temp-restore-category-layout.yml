name: Temporary restore category layout
on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/temp-restore-category-layout.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore category layout only
        run: |
          git checkout 955a047e7db46f629c56021e9f93eab72374565c -- modules/legado-enhance/java/io/legado/app/enhance/explore/ui/ModernDiscoveryFilterBar.kt
          git rm .github/workflows/temp-restore-category-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/legado-enhance/java/io/legado/app/enhance/explore/ui/ModernDiscoveryFilterBar.kt
          git commit -m "fix(explore): exclude category rows from adaptive layout"
          git push
