name: Apply Source Kind Popup Perf Patch

on:
  push:
    branches: [ beta ]
    paths:
      - '.github/workflows/apply-source-kind-popup-perf.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python scripts/optimize_source_kind_popup.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/io/legado/app/ui/main/explore/ExploreScreen.kt
          git commit -m 'perf(explore): make source category popup immediate'
          git push origin HEAD:beta
