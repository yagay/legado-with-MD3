name: Patch Modern Select Runtime V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-modern-select-runtime-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Jie"
          git config user.email "1614094+yagay@users.noreply.github.com"
          cd modules/legado-enhance
          git config user.name "Jie"
          git config user.email "1614094+yagay@users.noreply.github.com"
          git checkout MD3
          git add java/io/legado/app/enhance/explore/vm/ExploreViewModelEnhance.kt
          git diff --cached --quiet || git commit -m "feat: apply modern select controls to waterfall filters"
          git push origin HEAD:MD3
          cd ../..
          git add modules/legado-enhance
          git diff --cached --quiet || git commit -m "feat: wire modern select controls into waterfall"
          git push origin HEAD:main
