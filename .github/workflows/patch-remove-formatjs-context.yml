name: Remove obsolete formatJs Context wrapper

on:
  push:
    branches: [ beta ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Remove obsolete legacy Context wrapper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/io/legado/app/model/webBook/BookChapterList.kt')
          s = p.read_text(encoding='utf-8')
          old = '''        if (!formatJs.isNullOrBlank()) {\n            Context.enter().use {\n                val bindings = ScriptBindings()\n                bindings["gInt"] = 0\n                list.forEachIndexed { index, bookChapter ->\n'''
          new = '''        if (!formatJs.isNullOrBlank()) {\n            val bindings = ScriptBindings()\n            bindings["gInt"] = 0\n            list.forEachIndexed { index, bookChapter ->\n'''
          if old not in s:
              raise SystemExit('formatJs Context opening anchor not found')
          s = s.replace(old, new, 1)
          old_end = '''                    }.onFailure {\n                        Debug.log(book.origin, "格式化标题出错, ${it.localizedMessage}")\n                    }\n                }\n            }\n        }\n        val replaceRules = ContentProcessor.get(book).getTitleReplaceRules()\n'''
          new_end = '''                }.onFailure {\n                    Debug.log(book.origin, "格式化标题出错, ${it.localizedMessage}")\n                }\n            }\n        }\n        val replaceRules = ContentProcessor.get(book).getTitleReplaceRules()\n'''
          if old_end not in s:
              raise SystemExit('formatJs Context closing anchor not found')
          s = s.replace(old_end, new_end, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/io/legado/app/model/webBook/BookChapterList.kt
          git diff --cached --quiet && exit 0
          git commit -m "fix: remove obsolete formatJs Rhino Context wrapper"
          git push
