name: Apply Discovery Slider Preview

on:
  push:
    branches: [ beta ]
    paths:
      - '.github/workflows/apply-discovery-slider-preview.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python scripts/apply_discovery_slider_preview.py
      - name: Commit patch and remove temporary files
        run: |
          rm scripts/apply_discovery_slider_preview.py
          rm .github/workflows/apply-discovery-slider-preview.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(explore): preview waterfall sliders live'
          git push origin HEAD:beta
