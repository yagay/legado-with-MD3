name: Beta3 Build Verification

on:
  push:
    branches:
      - beta3
    paths-ignore:
      - '**/modules/web/**'
  pull_request:
    branches:
      - beta3
    paths-ignore:
      - '**/modules/web/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta3-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Remove Aliyun mirrors (unreliable in CI)
        run: |
          sed -i '/maven.aliyun.com/d' settings.gradle

      - name: Build Universal Debug APK
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew assembleAppDebug \
              -PenableAbiSplits=false \
              --no-daemon \
              --no-configuration-cache; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Gradle build attempt $attempt failed; retrying after transient dependency/network error..."
            sleep $((attempt * 20))
          done

      - name: Upload Universal Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: beta3-debug-universal-apk
          if-no-files-found: error
          retention-days: 14
          path: app/build/outputs/apk/app/debug/*.apk

  release-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Remove Aliyun mirrors (unreliable in CI)
        run: |
          sed -i '/maven.aliyun.com/d' settings.gradle

      - name: Apply smoother pager click animation experiment
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/io/legado/app/ui/main/MainScreen.kt")
          text = path.read_text(encoding="utf-8")
          old = "            pagerState.animateScrollToPage(index)"
          new = '''            pagerState.animateScrollToPage(
                page = index,
                animationSpec = androidx.compose.animation.core.tween(
                    durationMillis = 260,
                    easing = androidx.compose.animation.core.FastOutSlowInEasing,
                ),
            )'''
          if text.count(old) != 1:
              raise SystemExit(f"animateScrollToPage(index) match count: {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          grep -n -A9 -B3 'animateScrollToPage' app/src/main/java/io/legado/app/ui/main/MainScreen.kt

      - name: Use isolated performance package id
        run: |
          sed -i 's/applicationId = "io.legato.kazusa"/applicationId = "io.legato.kazusa.perf"/' app/build.gradle.kts
          python3 - <<'PY'
          import json
          path = "app/google-services.json"
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)
          changed = False
          for client in data.get("client", []):
              android_info = client.get("client_info", {}).get("android_client_info", {})
              if android_info.get("package_name") == "io.legato.kazusa":
                  android_info["package_name"] = "io.legato.kazusa.perf"
                  changed = True
          if not changed:
              raise SystemExit("No io.legato.kazusa client found in google-services.json")
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False)
          PY
          grep -n 'applicationId = ' app/build.gradle.kts
          grep -o 'io\.legato\.kazusa\.perf' app/google-services.json | head -n 1

      - name: Create temporary CI signing key
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/beta3-ci.jks" \
            -storepass android \
            -keypass android \
            -alias beta3 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Beta3 CI,O=Legado,C=GB"

      - name: Build signed Universal Release APK
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew assembleAppRelease \
              -PenableAbiSplits=false \
              -PRELEASE_STORE_FILE="$RUNNER_TEMP/beta3-ci.jks" \
              -PRELEASE_STORE_PASSWORD=android \
              -PRELEASE_KEY_ALIAS=beta3 \
              -PRELEASE_KEY_PASSWORD=android \
              --no-daemon \
              --no-configuration-cache; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Release build attempt $attempt failed; retrying after transient dependency/network error..."
            sleep $((attempt * 20))
          done

      - name: Verify Release APK signature
        run: |
          APK="$(find app/build/outputs/apk/app/release -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" app/build/outputs/apk/app/release/beta3-performance-release.apk

      - name: Upload verified Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: beta3-release-performance-apk
          if-no-files-found: error
          retention-days: 14
          path: app/build/outputs/apk/app/release/beta3-performance-release.apk
