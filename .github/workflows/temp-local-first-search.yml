name: Temporary local-first waterfall search fix
on:
  push:
    branches:
      - beta
    paths:
      - scripts/temp_local_first_search.py
      - .github/workflows/temp-local-first-search.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
      - name: Apply patch
        run: python3 scripts/temp_local_first_search.py
      - name: Clean temporary files
        run: rm -f scripts/temp_local_first_search.py .github/workflows/temp-local-first-search.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(explore): keep waterfall search local-first"
          git push origin beta
