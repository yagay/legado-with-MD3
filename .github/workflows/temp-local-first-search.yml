name: Temporary local-first waterfall search fix
on:
  push:
    branches: [ beta ]
    paths: [ '.github/workflows/temp-local-first-search.yml' ]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
      - name: Patch search order
        shell: python
        run: |
          from pathlib import Path
          p = Path('modules/legado-enhance/java/io/legado/app/enhance/explore/vm/ExploreViewModelEnhance.kt')
          s = p.read_text()
          old = '''            // A structurally confirmed source-native text + button search owns the name-search
            // path. We feed the top-bar value into the original InfoMap key and execute the
            // original actions, so the source's own explore URL/category/paging logic remains
            // authoritative. No title/locale keyword guessing is used.
            val embeddedControl = suiteSearchControl
            if (field == "name" && embeddedControl != null) {
                vm.updateUiState {
                    it.copy(
                        enhance = it.enhance.copy(
                            suiteSearchBooks = null,
                            suiteSearchLoading = true,
                            suiteSearchRemote = false,
                            suiteSearchPage = 1,
                            suiteSearchIsEnd = true
                        )
                    )
                }
                if (executeEmbeddedSearch(query, embeddedControl, suite, sourceUrl)) {
                    lastEmbeddedSearchQuery = query
                    return@launch
                }
                // If a source action fails at runtime, keep the existing standard/local
                // search fallback instead of leaving the page in a broken search state.
                vm.updateUiState {
                    it.copy(enhance = it.enhance.copy(suiteSearchLoading = false))
                }
            }

            if (field == "name" && !source?.searchUrl.isNullOrBlank()) {
'''
          new = '''            // The top-bar search is always local-first: show matches from books that are
            // already loaded on the current waterfall page immediately. Remote source search is
            // an additive second stage, never a replacement for the local result set.
            vm.updateUiState {
                it.copy(
                    enhance = it.enhance.copy(
                        suiteSearchBooks = localMatches.toImmutableList(),
                        suiteSearchLoading = field == "name" && (!source?.searchUrl.isNullOrBlank() || suiteSearchControl != null),
                        suiteSearchRemote = field == "name" && !source?.searchUrl.isNullOrBlank(),
                        suiteSearchPage = 1,
                        suiteSearchIsEnd = field != "name" || source?.searchUrl.isNullOrBlank()
                    )
                )
            }

            if (field == "name" && !source?.searchUrl.isNullOrBlank()) {
'''
          if old not in s:
              raise SystemExit('target search block not found')
          s = s.replace(old, new, 1)
          old2 = '''            } else if (vm.uiState.value.searchKey.trim() == query) {
                vm.updateUiState {
                    it.copy(
                        enhance = it.enhance.copy(
                            suiteSearchBooks = localMatches.toImmutableList(),
                            suiteSearchLoading = false,
                            suiteSearchRemote = false,
                            suiteSearchPage = 1,
                            suiteSearchIsEnd = true
                        )
                    )
                }
            }
'''
          new2 = '''            } else if (field == "name" && suiteSearchControl != null) {
                // Sources without a standard searchUrl may expose a native text+button search
                // in exploreKinds(). Keep local matches visible first, then invoke that native
                // search as a compatibility fallback without replacing the local-first contract.
                val embeddedControl = suiteSearchControl
                if (embeddedControl != null && executeEmbeddedSearch(query, embeddedControl, suite, sourceUrl)) {
                    lastEmbeddedSearchQuery = query
                } else if (vm.uiState.value.searchKey.trim() == query) {
                    vm.updateUiState {
                        it.copy(enhance = it.enhance.copy(suiteSearchLoading = false))
                    }
                }
            } else if (vm.uiState.value.searchKey.trim() == query) {
                vm.updateUiState {
                    it.copy(
                        enhance = it.enhance.copy(
                            suiteSearchBooks = localMatches.toImmutableList(),
                            suiteSearchLoading = false,
                            suiteSearchRemote = false,
                            suiteSearchPage = 1,
                            suiteSearchIsEnd = true
                        )
                    )
                }
            }
'''
          if old2 not in s:
              raise SystemExit('target fallback block not found')
          p.write_text(s.replace(old2, new2, 1))
      - name: Remove temporary workflow
        run: rm -f .github/workflows/temp-local-first-search.yml
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(explore): keep waterfall search local-first"
          git push origin beta