name: Temporary adaptive controls migration

on:
  push:
    branches: [beta]
    paths:
      - 'scripts/temp_apply_adaptive_controls.py'
      - '.github/workflows/temp-apply-adaptive-controls.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply migration
        run: python scripts/temp_apply_adaptive_controls.py
      - name: Remove temporary migration files
        run: |
          rm scripts/temp_apply_adaptive_controls.py
          rm .github/workflows/temp-apply-adaptive-controls.yml
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(explore): pack native controls into adaptive rows'
          git push
