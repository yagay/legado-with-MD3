      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Remove Aliyun mirrors for CI
        run: sed -i '/maven.aliyun.com/d' settings.gradle

      - name: Compile corrected phase 3
        timeout-minutes: 45
        run: |
          chmod +x gradlew
          ./gradlew assembleAppDebug \
            -PenableAbiSplits=false \
            --no-daemon \
            --no-configuration-cache

      - name: Run focused compatibility tests
        timeout-minutes: 30
        run: |
          ./gradlew \
            :app:testAppDebugUnitTest \
            --tests "io.legado.app.ui.main.explore.ExploreUpstreamReuseTest" \
            --tests "io.legado.app.enhance.explore.builder.ModernExploreClassificationEngineTest" \
            --tests "io.legado.app.enhance.explore.screen.AdaptiveExploreControlRowsTest" \
            --no-daemon \
            --no-configuration-cache

      - name: Commit corrected phase 3 to beta2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: stop hidden main-page database collectors'
          git push origin HEAD:beta2
