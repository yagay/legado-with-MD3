          explore_show = 'app/src/main/java/io/legado/app/ui/book/explore/ExploreShowScreen.kt'
          replace_exact(explore_show, 'key = { index, item -> "${item.book.bookUrl}:$index" }', 'key = { _, item -> item.book.bookUrl }', 2)

          for workflow in (
              '.github/workflows/beta2-performance-phase3-once.yml',
              '.github/workflows/beta2-performance-phase3-fix-once.yml',
          ):
              p = Path(workflow)
              if p.exists():
                  p.unlink()
