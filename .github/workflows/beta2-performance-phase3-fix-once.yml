          rss_vm = 'app/src/main/java/io/legado/app/ui/main/rss/RssViewModel.kt'
          replace_exact(rss_vm, 'import kotlinx.coroutines.ExperimentalCoroutinesApi\n', 'import kotlinx.coroutines.ExperimentalCoroutinesApi\nimport kotlinx.coroutines.Job\n', 1)
          replace_exact(rss_vm, 'import kotlinx.coroutines.flow.combine\n', 'import kotlinx.coroutines.flow.combine\nimport kotlinx.coroutines.flow.collectLatest\nimport kotlinx.coroutines.flow.distinctUntilChanged\n', 1)
          replace_exact(rss_vm, 'import kotlinx.coroutines.flow.launchIn\n', 'import kotlinx.coroutines.flow.launchIn\nimport kotlinx.coroutines.flow.map\n', 1)
          replace_exact(
              rss_vm,
              '''    private val _effects = MutableSharedFlow<RssEffect>(extraBufferCapacity = 8)
    val effects = _effects.asSharedFlow()

    init {
        _uiState.update { it.copy(isLoading = true) }
        initGroupData()
        initRssData()
    }
''',
              '''    private val _effects = MutableSharedFlow<RssEffect>(extraBufferCapacity = 8)
    val effects = _effects.asSharedFlow()
    private var groupDataJob: Job? = null
    private var rssDataJob: Job? = null

    init {
        _uiState.update { it.copy(isLoading = true) }
        observeActiveSubscriptions()
    }

    private fun observeActiveSubscriptions() {
        viewModelScope.launch {
            _uiState.subscriptionCount
                .map { it > 0 }
                .distinctUntilChanged()
                .collectLatest { active ->
                    if (active) {
                        initGroupData()
                        initRssData()
                    } else {
                        groupDataJob?.cancel()
                        rssDataJob?.cancel()
                    }
                }
        }
    }
