name: Beta2 Performance Phase 3 Fixed (one-shot)

on:
  push:
    branches:
      - beta2
    paths:
      - '.github/workflows/beta2-performance-phase3-fix-once.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta2
        uses: actions/checkout@v5
        with:
          ref: beta2
          fetch-depth: 0

      - name: Apply corrected phase 3 performance patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if count is not None and found != count:
                  raise SystemExit(f"{path}: expected {count} occurrences, found {found}: {old[:140]!r}")
              if found == 0:
                  raise SystemExit(f"{path}: pattern not found: {old[:140]!r}")
              p.write_text(text.replace(old, new))
              print(f"patched {path}: {found} occurrence(s)")

          explore_vm = 'app/src/main/java/io/legado/app/ui/main/explore/ExploreViewModel.kt'
          replace_exact(explore_vm, 'import kotlinx.coroutines.flow.collectLatest\n', 'import kotlinx.coroutines.flow.collectLatest\nimport kotlinx.coroutines.flow.distinctUntilChanged\n', 1)
          replace_exact(
              explore_vm,
              '''    private var exploreJob: Job? = null
    private var kindsJob: Job? = null
''',
              '''    private var exploreJob: Job? = null
    private var groupsJob: Job? = null
    private var settingsJob: Job? = null
    private var kindsJob: Job? = null
''', 1)
          replace_exact(
              explore_vm,
              '''        observeGroups()
        observeExplore()

        viewModelScope.launch {
            customSettingsGateway.settings.collectLatest { settings ->
                _uiState.update {
                    it.copy(
                        layoutSwitcherEnabled = if (settings.masterSwitch) settings.discoveryLayoutSwitcherEnabled else true,
                    )
                }
            }
        }
''',
              '''        observeActiveSubscriptions()
''', 1)
          replace_exact(
              explore_vm,
              '''    private fun observeGroups() {
        viewModelScope.launch {
''',
              '''    private fun observeActiveSubscriptions() {
        viewModelScope.launch {
            _uiState.subscriptionCount
                .map { it > 0 }
                .distinctUntilChanged()
                .collectLatest { active ->
                    if (active) {
                        observeGroups()
                        observeExplore()
                        observeSettings()
                    } else {
                        groupsJob?.cancel()
                        exploreJob?.cancel()
                        settingsJob?.cancel()
                        kindsJob?.cancel()
                    }
                }
        }
    }

    private fun observeSettings() {
        settingsJob?.cancel()
        settingsJob = viewModelScope.launch {
            customSettingsGateway.settings.collectLatest { settings ->
                _uiState.update {
                    it.copy(
                        layoutSwitcherEnabled = if (settings.masterSwitch) settings.discoveryLayoutSwitcherEnabled else true,
                    )
                }
            }
        }
    }

    private fun observeGroups() {
        groupsJob?.cancel()
        groupsJob = viewModelScope.launch {
